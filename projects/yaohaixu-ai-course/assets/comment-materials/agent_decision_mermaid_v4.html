<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择路径 · comment material</title>
  <link rel="stylesheet" href="../css2.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
  :root {
    --color-background-primary: #fffdf8;
    --color-background-secondary: #f4fbfa;
    --color-background-info: #e6f1fb;
    --color-background-success: #e1f5ee;
    --color-background-warning: #faeeda;
    --color-background-danger: #ffe9e4;
    --color-text-primary: #17343a;
    --color-text-secondary: rgba(23, 52, 58, .72);
    --color-text-tertiary: rgba(23, 52, 58, .52);
    --color-text-info: #0c447c;
    --color-text-success: #085041;
    --color-text-warning: #633806;
    --color-text-danger: #8c241c;
    --color-border-secondary: rgba(23, 52, 58, .24);
    --color-border-tertiary: rgba(23, 52, 58, .12);
    --color-border-info: #178f92;
    --border-radius-md: 10px;
    --border-radius-lg: 18px;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 0; background: transparent; }
  body {
    padding: 18px;
    color: var(--color-text-primary);
    font-family: "Plus Jakarta Sans", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  button {
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    border-radius: var(--border-radius-md);
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  svg, img { max-width: 100%; height: auto; }
  .material-content { display: block; }
</style>
</head>
<body>
<main class="material-content">

<style>
  #chart{padding:8px 0}
  #chart svg{width:100%;height:auto}
</style>
<div id="chart"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  flowchart: { curve: 'basis', padding: 16, nodeSpacing: 28, rankSpacing: 36 },
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    primaryColor: dark ? '#26215C' : '#EEEDFE',
    primaryTextColor: dark ? '#AFA9EC' : '#3C3489',
    primaryBorderColor: dark ? '#534AB7' : '#AFA9EC',
    lineColor: dark ? '#888780' : '#888780',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    nodeTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const rc = dark ? '#1a2a1a' : '#E8F5E8';
const rs = dark ? '#0F6E56' : '#1D9E75';
const rt = dark ? '#c2c0b6' : '#2C2C2A';

const diagram = `flowchart TD
  START(["选哪个 Agent 方案？"])

  START --> Q1{"能搞定海外账号？\nAnthropic / OpenAI\n每月 $20+ 订阅"}

  Q1 -->|"能"| R1["Claude Code + Codex\n写代码办公自动化都是天花板\n两个都用是最佳实践"]

  Q1 -->|"不能"| Q2{"想要顶级框架能力吗？\n（和 Claude Code 同级\n但模型换成第三方）"}

  Q2 -->|"想要最强框架"| R2["Trae + CC Switch\n同级框架能力 换第三方模型\n成本降到 1/10"]

  Q2 -->|"够用就行"| Q3{"数据能上传到云端吗？\n（有没有隐私顾虑）"}

  Q3 -->|"可以上云"| Q4{"你 / 团队日常\n用什么沟通工具？"}
  Q3 -->|"必须留本地"| Q5{"能接受\n命令行操作吗？"}

  Q4 -->|"飞书"| R5["ArkClaw / Coze\n飞书扫码即用 团队协作最佳"]
  Q4 -->|"微信 / QQ"| R6["QClaw\n微信里发消息就能操控电脑"]
  Q4 -->|"个人 / 其他"| Q6{"愿意花 2-4 周\n让 Agent 学习你的习惯？"}

  Q6 -->|"愿意投入时间"| R3B["Hermes Agent\n越用越懂你 长期收益最大"]
  Q6 -->|"现在就要能用"| R7["MaxClaw / KimiClaw\n零门槛 5 分钟上手"]

  Q5 -->|"能接受"| R3C["Hermes Agent 本地模式\n数据不出你电脑 + 自学习"]
  Q5 -->|"完全不行"| R8["AutoClaw（智谱） / Trae / WorkBuddy\n本地图形界面 有免费额度"]

  BOTTOM(["以上都不想碰？\n继续用 ChatGPT / Gemini / 豆包 / Kimi"])

  style R1 fill:${rc},stroke:${rs},color:${rt}
  style R2 fill:${rc},stroke:${rs},color:${rt}
  style R3B fill:${rc},stroke:${rs},color:${rt}
  style R3C fill:${rc},stroke:${rs},color:${rt}
  style R5 fill:${rc},stroke:${rs},color:${rt}
  style R6 fill:${rc},stroke:${rs},color:${rt}
  style R7 fill:${rc},stroke:${rs},color:${rt}
  style R8 fill:${rc},stroke:${rs},color:${rt}
  style BOTTOM fill:${dark?'#2C2C2A':'#F1EFE8'},stroke:${dark?'#444441':'#B4B2A9'},color:${dark?'#B4B2A9':'#5F5E5A'}
  style START fill:${dark?'#26215C':'#EEEDFE'},stroke:${dark?'#534AB7':'#AFA9EC'},color:${dark?'#AFA9EC':'#3C3489'}
`;

const { svg } = await mermaid.render('mermaid-chart', diagram);
document.getElementById('chart').innerHTML = svg;

document.querySelectorAll('#chart svg .node rect, #chart svg .node polygon').forEach(el => {
  if (!el.getAttribute('rx') || parseFloat(el.getAttribute('rx')) < 8) {
    el.setAttribute('rx', '8');
    el.setAttribute('ry', '8');
  }
});
</script>

</main>

</body>
</html>
